        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            min-height: 100vh;
            padding-bottom: 80px;
            transition: background 0.4s ease;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        @keyframes livePulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(255, 0, 0, 0);
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header {
            background: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
            animation: slideDown 0.5s ease;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            font-size: 28px;
            color: var(--accent);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        .header-text h1 {
            font-family: 'Playfair Display', serif;
            color: var(--accent);
            font-size: 24px;
            font-weight: 900;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-text p {
            color: var(--text-light);
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .settings-btn {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .settings-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .settings-btn:active::before {
            width: 100px;
            height: 100px;
        }

        .settings-btn.spinning {
            animation: spin 0.6s ease-in-out;
        }

        .settings-btn:active {
            transform: scale(0.92);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.75);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;
            opacity: 1;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: white;
            border-radius: 25px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: scaleIn 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0,0,0,0.08);
        }

        .modal-header h3 {
            color: var(--accent);
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .close-btn {
            background: rgba(0,0,0,0.05);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 18px;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .close-btn:hover {
            background: rgba(0,0,0,0.1);
            transform: rotate(90deg);
        }

        .close-btn.spinning {
            animation: spin 0.5s ease-in-out;
        }

        .close-btn:active {
            transform: scale(0.9);
        }

        .theme-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .theme-option {
            background: linear-gradient(135deg, #f8f9fa, #ffffff);
            border: 2px solid rgba(0,0,0,0.06);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            position: relative;
            overflow: hidden;
        }

        .theme-option:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .theme-option:active {
            transform: scale(0.96);
        }

        .theme-option.active {
            border-color: var(--accent);
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            transform: scale(1.03);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: scaleIn 0.3s ease;
        }

        .theme-option.active * {
            color: white !important;
        }

        .theme-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0,0,0,0.12);
        }

        .theme-info h4 {
            color: #2C3E50;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 3px;
            transition: color 0.3s ease;
        }

        .theme-info p {
            color: #7F8C8D;
            font-size: 10px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .theme-option[data-theme="white"] .theme-icon { background: linear-gradient(135deg, #FFFFFF, #F5F5F5); color: #E74C3C; border: 2px solid #E74C3C; }
        .theme-option[data-theme="ocean"] .theme-icon { background: linear-gradient(135deg, #00CED1, #4682B4); }
        .theme-option[data-theme="sunset"] .theme-icon { background: linear-gradient(135deg, #FF6B6B, #FFD93D); }
        .theme-option[data-theme="purple"] .theme-icon { background: linear-gradient(135deg, #A78BFA, #7C3AED); }
        .theme-option[data-theme="mint"] .theme-icon { background: linear-gradient(135deg, #6EE7B7, #10B981); }

        .content-wrapper {
            padding: 20px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .filter-section {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            animation: slideUp 0.4s ease;
        }

        .filter-section h3 {
            color: var(--accent);
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 15px;
            transition: color 0.3s ease;
            letter-spacing: 0.5px;
        }

        .filter-group {
            margin-bottom: 15px;
        }

        .filter-group label {
            display: block;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        .filter-group select {
            width: 100%;
            background: white;
            border: 2px solid #E0E0E0;
            color: var(--text-color);
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .filter-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
        }

        .new-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #FF0000;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: livePulse 2s infinite;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            z-index: 10;
        }

        .new-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        .shayari-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            animation: slideUp 0.4s ease;
            position: relative;
        }

        .author-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .author-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            transition: all 0.3s ease;
        }

        .author-info h4 {
            color: var(--text-color);
            font-size: 15px;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .author-info span {
            color: var(--text-light);
            font-size: 12px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .shayari-image {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .shayari-text {
            color: var(--text-color);
            line-height: 1.8;
            font-size: 15px;
            margin-bottom: 15px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .shayari-text.hindi {
            font-family: 'Noto Nastaliq Urdu', serif;
            font-size: 17px;
        }

        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .tag {
            background: #F8F9FA;
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .action-btn {
            background: linear-gradient(135deg, #f8f9fa, #ffffff);
            border: 2px solid #E0E0E0;
            color: var(--accent);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .action-btn i {
            font-size: 14px;
            font-weight: 900;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn.liked {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            padding: 10px 0 5px 0;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.1);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .nav-item {
            text-align: center;
            padding: 8px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .nav-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 3px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border-radius: 3px 3px 0 0;
            transition: width 0.3s ease;
        }

        .nav-item.active::after {
            width: 60%;
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        .nav-item i {
            font-size: 22px;
            color: var(--text-light);
            display: block;
            margin-bottom: 3px;
            transition: all 0.3s ease;
        }

        .nav-item span {
            font-size: 11px;
            color: var(--text-light);
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .nav-item.active i,
        .nav-item.active span {
            color: var(--accent);
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
        }

        .loading i {
            font-size: 40px;
            color: var(--accent);
            animation: spin 1s linear infinite;
        }

        .loading p {
            color: var(--text-color);
            margin-top: 10px;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            animation: fadeIn 0.5s ease;
        }

        .empty-state i {
            font-size: 60px;
            color: var(--accent);
            opacity: 0.5;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            color: var(--text-color);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: var(--text-light);
            font-size: 13px;
            font-weight: 600;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .ai-badge {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 13px;
            z-index: 4000;
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            letter-spacing: 0.5px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2500;
        }

        .modal-overlay.show {
            display: block;
        }

        .share-modal {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-radius: 25px 25px 0 0;
            padding: 20px;
            z-index: 3000;
        }

        .share-modal.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        .share-modal-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #E0E0E0;
        }

        .share-modal-header h3 {
            color: var(--accent);
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .share-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .share-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .share-option:active {
            transform: scale(0.92);
        }

        .share-icon {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;

        .share-icon.facebook { background: linear-gradient(135deg, #1877F2, #0D5DBF); }
        .share-icon.twitter { background: linear-gradient(135deg, #1DA1F2, #0C7ABF); }
        .share-icon.messenger { background: linear-gradient(135deg, #00B2FF, #006AFF); }
        .share-icon.copy { background: linear-gradient(135deg, #667eea, #764ba2); }
        .share-icon.more { background: linear-gradient(135deg, #f093fb, #f5576c); }

        .share-option span {
            font-size: 11px;
            color: var(--text-color);
            font-weight: 700;
        }

        * {
            scroll-behavior: smooth;
        }

        .modal-content::-webkit-scrollbar {
            width: 5px;
        }

        .modal-content::-webkit-scrollbar-track {

            border-radius: 10px;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

    </style>

    <div class="header">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>

    <script>
        const firebaseConfig = {

            authDomain: "aishagameapp.firebaseapp.com",
            databaseURL: "https://aishagameapp-default-rtdb.firebaseio.com",
            projectId: "aishagameapp",

            measurementId: "G-N6QH06L4N5"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let allShayari = [];
        let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        let currentShareId = null;

        const themes = [
            {id: 'white', name: 'White', desc: 'Clean'},
            {id: 'ocean', name: 'Ocean', desc: 'Breeze'},
            {id: 'sunset', name: 'Sunset', desc: 'Glow'},

            {id: 'mauve', name: 'Mauve', desc: 'Purple'}
        ];

        function loadThemes() {
            const container = document.getElementById('themeContainer');
            let html = '';
            themes.forEach(function(theme) {
                const activeClass = theme.id === 'white' ? 'active' : '';
                html += `<div class="theme-option ${activeClass}" data-theme="${theme.id}" onclick="changeTheme('${theme.id}')">`;
                html += `<div class="theme-icon"><i class="fas fa-palette"></i></div>`;
                html += `<div class="theme-info"><h4>${theme.name}</h4><p>${theme.desc}</p></div>`;
                html += '</div>';
            });
            container.innerHTML = html;
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'white';
            applyTheme(savedTheme);
            loadThemes();
        }

        function changeTheme(theme) {
            localStorage.setItem('theme', theme);
            applyTheme(theme);
            showToast('✨ Theme changed!');
            setTimeout(() => closeSettings(), 250);
        }

        function applyTheme(theme) {
            document.body.className = '';
            if (theme !== 'white') {
                document.body.classList.add('theme-' + theme);
            }
            
            document.querySelectorAll('.theme-option').forEach(function(option) {
                option.classList.remove('active');
                if (option.getAttribute('data-theme') === theme) {
                    option.classList.add('active');
                }
            });
        }

        function openSettings() {
            const btn = document.getElementById('settingsBtn');
            btn.classList.add('spinning');
            setTimeout(() => btn.classList.remove('spinning'), 600);
            
            document.getElementById('settingsModal').classList.add('show');
        }

        function closeSettings() {
            const btn = document.getElementById('closeBtn');
            btn.classList.add('spinning');
            setTimeout(() => btn.classList.remove('spinning'), 500);
            
            document.getElementById('settingsModal').classList.remove('show');
        }

        document.getElementById('settingsModal').addEventListener('click', function(e) {
            if (e.target.id === 'settingsModal') closeSettings();
        });

        function openShareModal(id) {
            currentShareId = id;
            document.getElementById('shareOverlay').classList.add('show');
            document.getElementById('shareModal').classList.add('show');
        }

        function closeShareModal() {
            document.getElementById('shareOverlay').classList.remove('show');
            document.getElementById('shareModal').classList.remove('show');
        }

        function shareToSocial(platform) {
            if (!currentShareId) return;
            const shayari = allShayari.find(s => s.id === currentShareId);
            if (!shayari) return;
            
            const text = shayari.text + '\n\n- ' + shayari.authorName + '\n\n📱 Shared via Aisha Shayari';
            const encodedText = encodeURIComponent(text);
            let shareUrl = '';
            
            switch(platform) {
                case 'whatsapp':
                    shareUrl = 'https://api.whatsapp.com/send?text=' + encodedText;
                    window.open(shareUrl, '_blank');
                    closeShareModal();
                    showToast('✅ Opening WhatsApp...');
                    break;
                    
                case 'telegram':
                    shareUrl = 'tg://msg_url?url=&text=' + encodedText;
                    setTimeout(() => {
                        const fallback = 'https://t.me/share/url?text=' + encodedText;
                        window.open(fallback, '_blank');
                    }, 500);
                    try {
                        window.location.href = shareUrl;
                    } catch(e) {
                        window.open('https://t.me/share/url?text=' + encodedText, '_blank');
                    }
                    closeShareModal();
                    showToast('✅ Opening Telegram...');
                    break;
                    
                case 'instagram':
                    copyShayari(currentShareId);
                    closeShareModal();
                    showToast('📋 Text copied! Now paste in Instagram');
                    break;
                    
                case 'facebook':
                    shareUrl = 'https://www.facebook.com/sharer/sharer.php?quote=' + encodedText;
                    window.open(shareUrl, '_blank');
                    closeShareModal();
                    showToast('✅ Opening Facebook...');
                    break;
                    
                case 'twitter':
                    shareUrl = 'https://twitter.com/intent/tweet?text=' + encodedText;
                    window.open(shareUrl, '_blank');
                    closeShareModal();
                    showToast('✅ Opening Twitter...');
                    break;
                    
                case 'messenger':
                    shareUrl = 'fb-messenger://share/?link=' + encodeURIComponent(window.location.href) + '&quote=' + encodedText;
                    setTimeout(() => {
                        window.open('https://www.facebook.com/dialog/send?link=' + encodeURIComponent(window.location.href), '_blank');
                    }, 500);
                    try {
                        window.location.href = shareUrl;
                    } catch(e) {
                        window.open('https://www.facebook.com/dialog/send?link=' + encodeURIComponent(window.location.href), '_blank');
                    }
                    closeShareModal();
                    showToast('✅ Opening Messenger...');
                    break;
                    
                case 'copy':
                    copyShayari(currentShareId);
                    closeShareModal();
                    break;
                    
                case 'more':
                    if (navigator.share) {
                        navigator.share({ 
                            title: 'Aisha Shayari', 
                            text: text
                        }).then(() => {
                            closeShareModal();
                            showToast('✅ Shared successfully!');
                        }).catch(() => {
                            copyShayari(currentShareId);
                            closeShareModal();
                        });
                    } else {
                        copyShayari(currentShareId);
                        closeShareModal();
                    }
                    break;
            }
        }

        window.onload = function() {
            initTheme();
            loadAllShayari();
        };

        function switchScreen(screen) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            if (screen === 'home') {
                document.getElementById('homeScreen').classList.add('active');
                document.querySelectorAll('.nav-item')[0].classList.add('active');
            } else if (screen === 'generate') {
                document.getElementById('generateScreen').classList.add('active');
                document.querySelectorAll('.nav-item')[1].classList.add('active');
            } else if (screen === 'favorites') {
                document.getElementById('favoritesScreen').classList.add('active');
                document.querySelectorAll('.nav-item')[2].classList.add('active');
                loadFavorites();
            }
        }

        function isNewShayari(timestamp) {
            const now = Date.now();
            const twentyFourHours = 24 * 60 * 60 * 1000;
            return (now - timestamp) < twentyFourHours;
        }

        function loadAllShayari() {
            database.ref('shayari').on('value', function(snapshot) {
                const data = snapshot.val();
                if (!data) {
                    document.getElementById('shayariContainer').innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><h3>No Shayari</h3><p>Check back later</p></div>';
                    return;
                }
                allShayari = [];
                for (let key in data) allShayari.push({ id: key, ...data[key] });
                allShayari.sort((a, b) => b.timestamp - a.timestamp);
                displayShayari(allShayari);
            });
        }

        function displayShayari(shayariArray) {
            const container = document.getElementById('shayariContainer');
            if (shayariArray.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><h3>No Results</h3><p>Try different filters</p></div>';
                return;
            }

            let html = '';
            shayariArray.forEach(item => {
                const isFavorite = favorites.indexOf(item.id) !== -1;
                const fontClass = item.language.toLowerCase();
                const authorPhoto = item.authorPhoto || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(item.authorName) + '&background=random&size=100';
                const imageHtml = item.imageUrl ? `<img src="${item.imageUrl}" class="shayari-image" alt="Shayari">` : '';
                const newBadge = isNewShayari(item.timestamp) ? '<div class="new-badge">NEW</div>' : '';

                html += '<div class="shayari-card">';
                html += newBadge;
                html += '<div class="author-header">';
                html += `<img src="${authorPhoto}" class="author-avatar" alt="${item.authorName}">`;
                html += `<div class="author-info"><h4>${escapeHtml(item.authorName)}</h4><span>${timeAgo(item.timestamp)}</span></div></div>`;
                html += imageHtml;
                html += `<div class="shayari-text ${fontClass}">${escapeHtml(item.text)}</div>`;
                html += '<div class="tags">';
                html += `<span class="tag"><i class="fas fa-tag"></i> ${item.category}</span>`;
                html += `<span class="tag"><i class="fas fa-language"></i> ${item.language}</span>`;
                html += `<span class="tag"><i class="fas fa-heart"></i> ${item.mood}</span>`;
                html += '</div><div class="actions">';
                html += `<button class="action-btn" onclick="copyShayari('${item.id}')"><i class="fas fa-copy"></i> Copy</button>`;
                html += `<button class="action-btn" onclick="openShareModal('${item.id}')"><i class="fas fa-share-alt"></i> Share</button>`;
                html += `<button class="action-btn ${isFavorite ? 'liked' : ''}" onclick="toggleFavorite('${item.id}')"><i class="fas fa-heart"></i> ${isFavorite ? 'Saved' : 'Save'}</button>`;
                html += '</div></div>';
            });

            container.innerHTML = html;
        }

        function filterShayari() {
            const category = document.getElementById('filterCategory').value;
            const language = document.getElementById('filterLanguage').value;
            let filtered = allShayari;
            if (category) filtered = filtered.filter(s => s.category === category);
            if (language) filtered = filtered.filter(s => s.language === language);
            displayShayari(filtered);
        }

        function generateAIShayari() {
            const category = document.getElementById('genCategory').value;
            const language = document.getElementById('genLanguage').value;
            if (!category || !language) {
                showToast('⚠️ Select category & language');
                return;
            }

            const similar = allShayari.filter(s => s.category === category && s.language === language);
            const generated = similar.length > 0 ? similar[Math.floor(Math.random() * similar.length)] : allShayari[Math.floor(Math.random() * allShayari.length)];
            
            if (!generated) {
                showToast('⚠️ No shayari available');
                return;
            }
            displayGeneratedShayari(generated);
        }

        function displayGeneratedShayari(item) {
            const container = document.getElementById('generatedContainer');
            const fontClass = item.language.toLowerCase();
            const authorPhoto = item.authorPhoto || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(item.authorName) + '&background=random&size=100';
            const imageHtml = item.imageUrl ? `<img src="${item.imageUrl}" class="shayari-image" alt="Shayari">` : '';

            container.innerHTML = `<div class="shayari-card"><span class="ai-badge"><i class="fas fa-robot"></i> AI GENERATED</span><div class="author-header"><img src="${authorPhoto}" class="author-avatar" alt="${item.authorName}"><div class="author-info"><h4>${escapeHtml(item.authorName)}</h4><span>AI Selected</span></div></div>${imageHtml}<div class="shayari-text ${fontClass}">${escapeHtml(item.text)}</div><div class="tags"><span class="tag"><i class="fas fa-tag"></i> ${item.category}</span><span class="tag"><i class="fas fa-language"></i> ${item.language}</span><span class="tag"><i class="fas fa-heart"></i> ${item.mood}</span></div><div class="actions"><button class="action-btn" onclick="copyShayari('${item.id}')"><i class="fas fa-copy"></i> COPY</button><button class="action-btn" onclick="openShareModal('${item.id}')"><i class="fas fa-share-alt"></i> SHARE</button><button class="action-btn" onclick="toggleFavorite('${item.id}')"><i class="fas fa-heart"></i> SAVE</button></div></div>`;
            showToast('✨ Generated!');
        }

        function toggleFavorite(id) {
            const index = favorites.indexOf(id);
            if (index !== -1) {
                favorites.splice(index, 1);
                showToast('💔 Removed from favorites');
            } else {
                favorites.push(id);
                showToast('❤️ Added to favorites');
            }
            localStorage.setItem('favorites', JSON.stringify(favorites));
            if (document.getElementById('homeScreen').classList.contains('active')) filterShayari();
            else if (document.getElementById('favoritesScreen').classList.contains('active')) loadFavorites();
        }

        function loadFavorites() {
            const container = document.getElementById('favoritesContainer');
            if (favorites.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-heart-broken"></i><h3>No Favorites</h3><p>Start saving shayari</p></div>';
                return;
            }
            const favShayari = allShayari.filter(s => favorites.indexOf(s.id) !== -1);
            let html = '';
            favShayari.forEach(item => {
                const fontClass = item.language.toLowerCase();
                const authorPhoto = item.authorPhoto || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(item.authorName) + '&background=random&size=100';
                const imageHtml = item.imageUrl ? `<img src="${item.imageUrl}" class="shayari-image" alt="Shayari">` : '';
                html += `<div class="shayari-card"><div class="author-header"><img src="${authorPhoto}" class="author-avatar" alt="${item.authorName}"><div class="author-info"><h4>${escapeHtml(item.authorName)}</h4><span>${timeAgo(item.timestamp)}</span></div></div>${imageHtml}<div class="shayari-text ${fontClass}">${escapeHtml(item.text)}</div><div class="tags"><span class="tag"><i class="fas fa-tag"></i> ${item.category}</span><span class="tag"><i class="fas fa-language"></i> ${item.language}</span><span class="tag"><i class="fas fa-heart"></i> ${item.mood}</span></div><div class="actions"><button class="action-btn" onclick="copyShayari('${item.id}')"><i class="fas fa-copy"></i> COPY</button><button class="action-btn" onclick="openShareModal('${item.id}')"><i class="fas fa-share-alt"></i> SHARE</button><button class="action-btn liked" onclick="toggleFavorite('${item.id}')"><i class="fas fa-heart"></i> SAVED</button></div></div>`;
            });
            container.innerHTML = html;
        }

        function copyShayari(id) {
            const shayari = allShayari.find(s => s.id === id);
            if (!shayari) return;
            const text = shayari.text + '\n\n- ' + shayari.authorName + '\n\n📱 Shared via Aisha Shayari';
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => showToast('✅ Copied!'));
            } else {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('✅ Copied!');
            }
        }

        function timeAgo(timestamp) {
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + ' min ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + ' hour ago';
            return Math.floor(seconds / 86400) + ' day ago';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function escapeHtml(text) {
            const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'};
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
